name: Android (Kotlin) build

on:
  push:
    paths:
      - "acne_classifier_android/**"
      - "mobile_models/**"
      - ".github/workflows/android-kotlin.yml"
  pull_request:
    paths:
      - "acne_classifier_android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acne_classifier_android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: acneapp-debug-apk
          path: acne_classifier_android/app/build/outputs/apk/debug/app-debug.apk
