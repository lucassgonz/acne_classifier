name: acne_classifier_app
description: "Region-aware facial acne severity assessment — research prototype"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+5
  image_picker: ^1.1.2
  image: ^4.2.0
  share_plus: ^10.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  onnxruntime: ^1.4.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
